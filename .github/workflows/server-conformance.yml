name: Server provider conformance
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: loom-test-only
          POSTGRES_DB: loom_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet run --project tests/Loom.Server.Tests -- postgres
        env:
          LOOM_TEST_CONNECTION: Host=localhost;Database=loom_test;Username=postgres;Password=loom-test-only
  sqlserver:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Loom_Test_Only_47!
        ports: ['1433:1433']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Wait for server and create isolated test database
        run: |
          for attempt in $(seq 1 30); do
            if docker exec '${{ job.services.sqlserver.id }}' /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Loom_Test_Only_47!' -C -Q 'CREATE DATABASE loom_test'; then exit 0; fi
            sleep 2
          done
          exit 1
      - run: dotnet run --project tests/Loom.Server.Tests -- sqlserver
        env:
          LOOM_TEST_CONNECTION: Server=localhost;Database=loom_test;User Id=sa;Password=Loom_Test_Only_47!;TrustServerCertificate=True
