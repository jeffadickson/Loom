name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Locked build, unit tests and executable examples
        run: dotnet msbuild build/Loom.proj -t:Test -p:Python=python
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked browser tooling
        run: npm ci
      - name: Install Chromium and Linux system dependencies
        if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - name: Install Chromium on Windows and macOS
        if: runner.os != 'Linux'
        run: npx --no-install playwright install chromium
      - name: Verify generated introduction and browser behavior
        run: dotnet msbuild build/Loom.proj -t:BrowserTest -p:Python=python
      - name: Package framework-dependent demo
        run: dotnet msbuild build/Loom.proj -t:Pack -p:Python=python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loom-${{ matrix.os }}
          path: |
            artifacts/test-results
            artifacts/*.zip
            artifacts/*.sha256
  python-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
      - run: uv sync --locked --group print
      - run: uv run --locked python -m compileall -q tools
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Provision isolated checksum-verified SDK and Node
        run: python tools/dev.py setup --browser
      - name: Diagnose installed local tools
        run: python tools/dev.py doctor --browser
