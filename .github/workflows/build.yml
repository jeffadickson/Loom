name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build web application
        run: dotnet build src/Loom.Demo/Loom.Demo.csproj --configuration Release
      - name: Run framework and SQLite checks
        run: dotnet run --project tests/Loom.Tests --configuration Release -- .
      - name: Run getting-started example
        run: dotnet run --project examples/Loom.GettingStarted --configuration Release
      - name: Build model generator
        run: dotnet build src/Loom.ModelTool --configuration Release
      - name: Compile generated models
        run: dotnet build tests/Loom.Generated.Tests --configuration Release
      - name: Run scientific quantity example
        run: dotnet run --project examples/Loom.Science --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test standalone and live introduction
        env:
          LOOM_CONFIGURATION: Release
          NODE_PATH: /tmp/loom-browser/node_modules
        run: |
          python3 tools/build_introduction.py
          git diff --exit-code -- Loom_Introduction.html
          npm install --prefix /tmp/loom-browser playwright@1.51.1
          /tmp/loom-browser/node_modules/.bin/playwright install --with-deps chromium
          python3 tools/test_introduction.py
